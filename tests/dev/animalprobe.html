<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from '../../vendor/meshopt/meshopt_decoder.module.js';
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const out = {};
for (const n of ['wolf', 'deer', 'stag', 'husky', 'fox', 'shiba']) {
  const g = await loader.loadAsync(`../../assets/models/rigged/${n}.glb`);
  g.scene.updateMatrixWorld(true);
  const mixer = new THREE.AnimationMixer(g.scene);
  const clip = g.animations.find((a) => a.name === 'Idle');
  mixer.clipAction(clip).play(); mixer.update(0.1);
  g.scene.updateMatrixWorld(true);
  const box = new THREE.Box3();
  g.scene.traverse((o) => { if (o.isSkinnedMesh) { o.computeBoundingBox(); const b = o.boundingBox.clone(); box.union(b.applyMatrix4(o.matrixWorld)); } });
  const mats = []; g.scene.traverse((o) => { if (o.isMesh) for (const m of [].concat(o.material)) mats.push(m.name + ':' + m.color.getHexString()); });
  // yürüme/dörtnal hızları: kök kemiklerin hareketi yok → bacak salınımından tahmin edilemez; süreler
  const durs = Object.fromEntries(g.animations.map((a) => [a.name, +a.duration.toFixed(2)]));
  out[n] = { size: box.getSize(new THREE.Vector3()).toArray().map((x) => +x.toFixed(2)), min: box.min.toArray().map((x) => +x.toFixed(2)), mats, durs };
}
window.__info = out;
</script></body></html>
