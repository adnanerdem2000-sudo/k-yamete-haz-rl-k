<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#333}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { Assets } from '../../src/core/Assets.js';
import { CharacterFactory, CHARACTERS } from '../../src/entities/CharacterFactory.js';
import { Pose } from '../../src/entities/CharacterRig.js';
import * as A from '../../src/entities/Animations.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5a6b7a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 1.5)); const dl = new THREE.DirectionalLight(0xffffff, 2.2); dl.position.set(2,5,6); scene.add(dl);
const cam = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 100);
const assets = new Assets('../../'); await assets.loadAll();
const fac = new CharacterFactory(assets);
const ids = Object.keys(CHARACTERS);
const back = q.get('back');
ids.forEach((id, i) => {
  const ch = fac.create(CHARACTERS[id].look);
  ch.root.position.x = (i - 2.5) * 1.25;
  if (back) ch.root.rotation.y = Math.PI;
  const p = new Pose(); A.idle(p, 1.0 + i); ch.rig.apply(p);
  scene.add(ch.root);
});
const zoom = q.get('zoom');
if (zoom) { cam.position.set(Number(zoom)*1.25 - 3.125, 1.55, 2.2); cam.lookAt(Number(zoom)*1.25 - 3.125, 1.45, 0); }
else { cam.position.set(0, 1.2, 10.5); cam.lookAt(0, 0.95, 0); }
r.render(scene, cam);
</script></body></html>
