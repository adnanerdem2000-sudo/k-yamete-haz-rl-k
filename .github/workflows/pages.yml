# GitHub Pages'e yayın: oyun derleme gerektirmeyen statik bir sitedir; depo olduğu gibi yayınlanır.
# Ön koşul: Settings → Pages → Source: "GitHub Actions". Depo şu an "Deploy from a branch" ile
# claude/kiyametten-once-game-0yng28 dalını doğrudan yayınlıyor; bu iş akışı main'e birleştirilince ya da elle
# (workflow_dispatch) kullanılır. Testler her dalda ci.yml ile koşar.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Birim testleri
        run: node --import ./tests/unit/register.mjs --test tests/unit/*.test.mjs
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          cp -r index.html src assets vendor .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
